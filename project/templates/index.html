<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image → 3D Model</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700&family=DM+Mono:wght@400;500&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0a0f;
    --surface: #111118;
    --surface2: #1a1a24;
    --border: rgba(255,255,255,0.07);
    --border-bright: rgba(255,255,255,0.15);
    --accent: #7c6cfa;
    --accent2: #3dd9b3;
    --text: #f0eff8;
    --muted: #8b8a9e;
    --danger: #f07575;
    --mono: 'DM Mono', monospace;
    --sans: 'Syne', sans-serif;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* Header */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1.25rem 2rem;
    border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 100;
    background: rgba(10,10,15,0.85);
    backdrop-filter: blur(12px);
  }
  .logo {
    display: flex; align-items: center; gap: 10px;
    font-size: 1.05rem; font-weight: 700; letter-spacing: -0.02em;
  }
  .logo-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 8px var(--accent); }
  .badge {
    font-family: var(--mono); font-size: 0.7rem;
    padding: 3px 10px; border-radius: 99px;
    border: 1px solid var(--border-bright);
    color: var(--muted); letter-spacing: 0.05em;
  }

  /* Layout */
  main {
    flex: 1;
    display: grid;
    grid-template-columns: 400px 1fr;
    gap: 0;
    height: calc(100vh - 61px);
  }

  /* Left panel */
  .panel-left {
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column;
    overflow-y: auto;
    padding: 2rem;
    gap: 1.5rem;
  }

  .section-label {
    font-family: var(--mono); font-size: 0.68rem;
    letter-spacing: 0.12em; color: var(--muted);
    text-transform: uppercase; margin-bottom: 0.6rem;
  }

  /* Drop zone */
  .dropzone {
    border: 1.5px dashed var(--border-bright);
    border-radius: 12px;
    padding: 2.5rem 1.5rem;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s;
    position: relative; overflow: hidden;
  }
  .dropzone:hover, .dropzone.dragover {
    border-color: var(--accent);
    background: rgba(124,108,250,0.05);
  }
  .dropzone input[type=file] {
    position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%;
  }
  .dz-icon {
    width: 48px; height: 48px; margin: 0 auto 1rem;
    border-radius: 12px; background: var(--surface2);
    border: 1px solid var(--border-bright);
    display: flex; align-items: center; justify-content: center;
  }
  .dz-icon svg { width: 22px; height: 22px; stroke: var(--accent); fill: none; stroke-width: 1.5; }
  .dz-title { font-size: 0.9rem; font-weight: 600; margin-bottom: 4px; }
  .dz-sub { font-size: 0.78rem; color: var(--muted); }

  /* Preview image */
  .img-preview {
    border-radius: 10px; overflow: hidden;
    border: 1px solid var(--border-bright);
    position: relative; display: none;
  }
  .img-preview img { width: 100%; display: block; max-height: 220px; object-fit: cover; }
  .img-preview .img-name {
    position: absolute; bottom: 0; left: 0; right: 0;
    padding: 8px 12px; font-family: var(--mono); font-size: 0.72rem;
    color: var(--muted); background: rgba(10,10,15,0.8);
  }
  .img-preview .clear-btn {
    position: absolute; top: 8px; right: 8px;
    width: 26px; height: 26px; border-radius: 50%;
    background: rgba(10,10,15,0.8); border: 1px solid var(--border-bright);
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    color: var(--muted); font-size: 14px; transition: all 0.15s;
  }
  .clear-btn:hover { color: var(--danger); border-color: var(--danger); }

  /* Generate button */
  .btn-generate {
    width: 100%; padding: 0.85rem;
    background: var(--accent);
    border: none; border-radius: 10px;
    font-family: var(--sans); font-size: 0.9rem; font-weight: 600;
    color: #fff; cursor: pointer;
    transition: all 0.2s; letter-spacing: -0.01em;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .btn-generate:hover:not(:disabled) { background: #6a5ae0; transform: translateY(-1px); }
  .btn-generate:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
  .btn-generate svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; }

  /* Status */
  .status-bar {
    background: var(--surface2); border-radius: 8px;
    padding: 0.75rem 1rem;
    font-family: var(--mono); font-size: 0.75rem;
    border: 1px solid var(--border);
    display: flex; align-items: center; gap: 8px;
    display: none;
  }
  .status-dot {
    width: 7px; height: 7px; border-radius: 50%;
    flex-shrink: 0;
  }
  .status-dot.loading { background: var(--accent); animation: pulse 1s infinite; }
  .status-dot.success { background: var(--accent2); }
  .status-dot.error { background: var(--danger); }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

  /* Download */
  .btn-download {
    width: 100%; padding: 0.75rem;
    background: transparent;
    border: 1px solid var(--accent2); border-radius: 10px;
    font-family: var(--sans); font-size: 0.88rem; font-weight: 600;
    color: var(--accent2); cursor: pointer;
    transition: all 0.2s;
    display: none; align-items: center; justify-content: center; gap: 8px;
  }
  .btn-download:hover { background: rgba(61,217,179,0.08); }
  .btn-download svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; }

  /* Info cards */
  .info-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
  }
  .info-card {
    background: var(--surface2); border-radius: 8px;
    padding: 0.75rem; border: 1px solid var(--border);
  }
  .info-card .ic-label { font-family: var(--mono); font-size: 0.65rem; color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; }
  .info-card .ic-value { font-size: 0.85rem; font-weight: 600; margin-top: 4px; }

  /* Right panel - 3D viewport */
  .panel-right {
    position: relative; background: var(--surface);
    display: flex; flex-direction: column;
  }
  #canvas-container {
    flex: 1; position: relative;
  }
  #three-canvas { display: block; width: 100%; height: 100%; }

  .viewport-overlay {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 12px; pointer-events: none;
  }
  .vp-idle-icon {
    width: 80px; height: 80px; border-radius: 20px;
    background: var(--surface2); border: 1px solid var(--border-bright);
    display: flex; align-items: center; justify-content: center;
  }
  .vp-idle-icon svg { width: 36px; height: 36px; stroke: var(--muted); fill: none; stroke-width: 1; }
  .vp-idle-text { font-size: 0.88rem; color: var(--muted); }

  /* Toolbar */
  .viewport-toolbar {
    position: absolute; top: 16px; right: 16px;
    display: flex; flex-direction: column; gap: 6px;
  }
  .tb-btn {
    width: 36px; height: 36px; border-radius: 8px;
    background: rgba(17,17,24,0.85); border: 1px solid var(--border-bright);
    color: var(--muted); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s; backdrop-filter: blur(6px);
  }
  .tb-btn:hover { color: var(--text); border-color: var(--accent); }
  .tb-btn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.8; }
  .tb-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

  /* Bottom bar */
  .viewport-bottom {
    padding: 10px 16px;
    border-top: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    font-family: var(--mono); font-size: 0.7rem; color: var(--muted);
  }
  .vb-controls { display: flex; gap: 16px; }
  .vb-hint { display: flex; align-items: center; gap: 5px; }
  .kbd {
    background: var(--surface2); border: 1px solid var(--border-bright);
    border-radius: 4px; padding: 1px 5px; font-size: 0.65rem;
  }

  /* Loading overlay for 3D */
  .loading-overlay {
    position: absolute; inset: 0;
    background: rgba(10,10,15,0.7); backdrop-filter: blur(4px);
    display: none; flex-direction: column;
    align-items: center; justify-content: center; gap: 16px;
  }
  .spinner {
    width: 44px; height: 44px; border-radius: 50%;
    border: 2px solid var(--border-bright);
    border-top-color: var(--accent);
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-text { font-family: var(--mono); font-size: 0.8rem; color: var(--muted); }
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-dot"></div>
    Image → 3D
  </div>
  <span class="badge">localhost:5000</span>
</header>

<main>
  <!-- LEFT PANEL -->
  <div class="panel-left">

    <div>
      <p class="section-label">Input Image</p>
      <div class="dropzone" id="dropzone">
        <input type="file" id="file-input" accept="image/*">
        <div class="dz-icon">
          <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>
        </div>
        <p class="dz-title">Kéo thả ảnh vào đây</p>
        <p class="dz-sub">hoặc click để chọn file · PNG, JPG, WEBP</p>
      </div>
    </div>

    <div class="img-preview" id="img-preview">
      <img id="preview-img" src="" alt="preview">
      <div class="img-name" id="img-name"></div>
      <button class="clear-btn" id="clear-btn" title="Xóa ảnh">✕</button>
    </div>

    <button class="btn-generate" id="btn-generate" disabled>
      <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
      Tạo mô hình 3D
    </button>

    <div class="status-bar" id="status-bar">
      <div class="status-dot" id="status-dot"></div>
      <span id="status-text">Đang xử lý...</span>
    </div>

    <button class="btn-download" id="btn-download">
      <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
      Tải xuống file .OBJ
    </button>

    <div>
      <p class="section-label">Thông tin</p>
      <div class="info-grid">
        <div class="info-card">
          <p class="ic-label">Vertices</p>
          <p class="ic-value" id="info-verts">—</p>
        </div>
        <div class="info-card">
          <p class="ic-label">Faces</p>
          <p class="ic-value" id="info-faces">—</p>
        </div>
        <div class="info-card">
          <p class="ic-label">File size</p>
          <p class="ic-value" id="info-size">—</p>
        </div>
        <div class="info-card">
          <p class="ic-label">Thời gian</p>
          <p class="ic-value" id="info-time">—</p>
        </div>
      </div>
    </div>

  </div>

  <!-- RIGHT PANEL -->
  <div class="panel-right">
    <div id="canvas-container">
      <canvas id="three-canvas"></canvas>

      <div class="viewport-overlay" id="vp-idle">
        <div class="vp-idle-icon">
          <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 16V8a2 2 0 00-1-1.73l-7-4a2 2 0 00-2 0l-7 4A2 2 0 003 8v8a2 2 0 001 1.73l7 4a2 2 0 002 0l7-4A2 2 0 0021 16z"/>
            <path d="M3.27 6.96L12 12.01l8.73-5.05M12 22.08V12"/>
          </svg>
        </div>
        <p class="vp-idle-text">Kết quả 3D sẽ hiện ở đây</p>
      </div>

      <div class="viewport-toolbar" id="vp-toolbar" style="display:none">
        <button class="tb-btn" id="btn-wireframe" title="Wireframe">
          <svg viewBox="0 0 24 24"><path d="M3 3h18v18H3z"/><path d="M3 3l9 9M21 3l-9 9M3 21l9-9M21 21l-9-9M12 3v18M3 12h18"/></svg>
        </button>
        <button class="tb-btn" id="btn-reset-cam" title="Reset camera">
          <svg viewBox="0 0 24 24"><path d="M1 4v6h6M23 20v-6h-6"/><path d="M20.49 9A9 9 0 005.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 013.51 15"/></svg>
        </button>
      </div>

      <div class="loading-overlay" id="loading-overlay">
        <div class="spinner"></div>
        <p class="loading-text" id="loading-text">Đang gửi ảnh tới model...</p>
      </div>
    </div>

    <div class="viewport-bottom">
      <span>3D Viewport</span>
      <div class="vb-controls">
        <span class="vb-hint"><span class="kbd">LMB</span> Xoay</span>
        <span class="vb-hint"><span class="kbd">RMB</span> Pan</span>
        <span class="vb-hint"><span class="kbd">Scroll</span> Zoom</span>
      </div>
    </div>
  </div>
</main>

<script>
// ─── State ───────────────────────────────────────────────────────────────────
const API_URL = 'http://localhost:5000/generate';
let selectedFile = null;
let objBlob = null;
let currentMesh = null;
let wireframeMode = false;

// ─── DOM refs ─────────────────────────────────────────────────────────────────
const dropzone     = document.getElementById('dropzone');
const fileInput    = document.getElementById('file-input');
const imgPreview   = document.getElementById('img-preview');
const previewImg   = document.getElementById('preview-img');
const imgName      = document.getElementById('img-name');
const clearBtn     = document.getElementById('clear-btn');
const btnGenerate  = document.getElementById('btn-generate');
const statusBar    = document.getElementById('status-bar');
const statusDot    = document.getElementById('status-dot');
const statusText   = document.getElementById('status-text');
const btnDownload  = document.getElementById('btn-download');
const vpIdle       = document.getElementById('vp-idle');
const vpToolbar    = document.getElementById('vp-toolbar');
const loadingOv    = document.getElementById('loading-overlay');
const loadingText  = document.getElementById('loading-text');
const infoVerts    = document.getElementById('info-verts');
const infoFaces    = document.getElementById('info-faces');
const infoSize     = document.getElementById('info-size');
const infoTime     = document.getElementById('info-time');

// ─── File handling ────────────────────────────────────────────────────────────
function handleFile(file) {
  if (!file || !file.type.startsWith('image/')) return;
  selectedFile = file;
  const url = URL.createObjectURL(file);
  previewImg.src = url;
  imgName.textContent = file.name + ' · ' + (file.size / 1024).toFixed(1) + ' KB';
  imgPreview.style.display = 'block';
  dropzone.style.display = 'none';
  btnGenerate.disabled = false;
  resetResult();
}

fileInput.addEventListener('change', e => handleFile(e.target.files[0]));

dropzone.addEventListener('dragover', e => { e.preventDefault(); dropzone.classList.add('dragover'); });
dropzone.addEventListener('dragleave', () => dropzone.classList.remove('dragover'));
dropzone.addEventListener('drop', e => {
  e.preventDefault();
  dropzone.classList.remove('dragover');
  handleFile(e.dataTransfer.files[0]);
});

clearBtn.addEventListener('click', () => {
  selectedFile = null;
  previewImg.src = '';
  imgPreview.style.display = 'none';
  dropzone.style.display = 'block';
  btnGenerate.disabled = true;
  fileInput.value = '';
  resetResult();
});

function resetResult() {
  objBlob = null;
  statusBar.style.display = 'none';
  btnDownload.style.display = 'none';
  vpToolbar.style.display = 'none';
  vpIdle.style.display = 'flex';
  if (currentMesh) { scene.remove(currentMesh); currentMesh = null; }
  infoVerts.textContent = infoFaces.textContent = infoSize.textContent = infoTime.textContent = '—';
}

// ─── API call ─────────────────────────────────────────────────────────────────
btnGenerate.addEventListener('click', async () => {
  if (!selectedFile) return;

  const startTime = Date.now();
  btnGenerate.disabled = true;
  statusBar.style.display = 'flex';
  statusDot.className = 'status-dot loading';
  statusText.textContent = 'Đang gửi ảnh tới model...';
  loadingOv.style.display = 'flex';
  loadingText.textContent = 'Đang gửi ảnh tới model...';
  vpIdle.style.display = 'none';

  const formData = new FormData();
  formData.append('image', selectedFile);

  try {
    loadingText.textContent = 'Model đang tạo 3D mesh...';
    statusText.textContent = 'Model đang xử lý ảnh...';

    const response = await fetch(API_URL, {
      method: 'POST',
      body: formData
    });

    if (!response.ok) {
      throw new Error(`Server trả về lỗi: ${response.status} ${response.statusText}`);
    }

    const contentType = response.headers.get('content-type') || '';
    let objText = '';

    if (contentType.includes('application/json')) {
      const json = await response.json();
      // Hỗ trợ nhiều format JSON: { obj: "...", obj_content: "...", data: "..." }
      objText = json.obj || json.obj_content || json.data || json.result || '';
      if (!objText) throw new Error('JSON response không có field .obj / .obj_content / .data');
    } else {
      objText = await response.text();
    }

    if (!objText.trim()) throw new Error('Response rỗng từ server');

    const elapsed = ((Date.now() - startTime) / 1000).toFixed(1);
    objBlob = new Blob([objText], { type: 'text/plain' });

    loadObj(objText, elapsed);

  } catch (err) {
    statusDot.className = 'status-dot error';
    statusText.textContent = '⚠ ' + err.message;
    loadingOv.style.display = 'none';
    btnGenerate.disabled = false;
    vpIdle.style.display = 'flex';
  }
});

// ─── Download ─────────────────────────────────────────────────────────────────
btnDownload.addEventListener('click', () => {
  if (!objBlob) return;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(objBlob);
  const baseName = selectedFile ? selectedFile.name.replace(/\.[^.]+$/, '') : 'model';
  a.download = baseName + '_3d.obj';
  a.click();
});

// ─── Three.js setup ───────────────────────────────────────────────────────────
const canvas = document.getElementById('three-canvas');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setClearColor(0x111118, 1);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, 1, 0.01, 1000);
camera.position.set(0, 0, 4);

// Lights
const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
scene.add(ambientLight);
const dirLight1 = new THREE.DirectionalLight(0xffffff, 0.8);
dirLight1.position.set(5, 10, 7);
scene.add(dirLight1);
const dirLight2 = new THREE.DirectionalLight(0x7c6cfa, 0.3);
dirLight2.position.set(-5, -5, -5);
scene.add(dirLight2);

// Grid
const gridHelper = new THREE.GridHelper(10, 20, 0x222230, 0x1a1a26);
scene.add(gridHelper);

// Resize
function resizeRenderer() {
  const container = document.getElementById('canvas-container');
  const w = container.clientWidth, h = container.clientHeight;
  renderer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
resizeRenderer();
window.addEventListener('resize', resizeRenderer);

// Orbit controls (manual)
let isDragging = false, isRightDrag = false;
let prevMouse = { x: 0, y: 0 };
let spherical = { theta: 0.5, phi: 1.2, radius: 4 };
let target = new THREE.Vector3(0, 0, 0);

canvas.addEventListener('mousedown', e => {
  isDragging = true;
  isRightDrag = e.button === 2;
  prevMouse = { x: e.clientX, y: e.clientY };
});
canvas.addEventListener('contextmenu', e => e.preventDefault());
window.addEventListener('mouseup', () => isDragging = false);
window.addEventListener('mousemove', e => {
  if (!isDragging) return;
  const dx = e.clientX - prevMouse.x;
  const dy = e.clientY - prevMouse.y;
  prevMouse = { x: e.clientX, y: e.clientY };
  if (isRightDrag) {
    const right = new THREE.Vector3();
    const up = new THREE.Vector3();
    camera.getWorldDirection(new THREE.Vector3());
    right.crossVectors(camera.getWorldDirection(new THREE.Vector3()), camera.up).normalize();
    up.copy(camera.up);
    target.addScaledVector(right, -dx * 0.005);
    target.addScaledVector(up, dy * 0.005);
  } else {
    spherical.theta -= dx * 0.008;
    spherical.phi = Math.max(0.1, Math.min(Math.PI - 0.1, spherical.phi - dy * 0.008));
  }
});
canvas.addEventListener('wheel', e => {
  spherical.radius = Math.max(0.5, Math.min(50, spherical.radius + e.deltaY * 0.01));
});

// Touch support
let lastTouchDist = 0;
canvas.addEventListener('touchstart', e => {
  if (e.touches.length === 1) { isDragging = true; prevMouse = { x: e.touches[0].clientX, y: e.touches[0].clientY }; }
  if (e.touches.length === 2) { lastTouchDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY); }
});
canvas.addEventListener('touchend', () => isDragging = false);
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  if (e.touches.length === 1 && isDragging) {
    const dx = e.touches[0].clientX - prevMouse.x, dy = e.touches[0].clientY - prevMouse.y;
    prevMouse = { x: e.touches[0].clientX, y: e.touches[0].clientY };
    spherical.theta -= dx * 0.008;
    spherical.phi = Math.max(0.1, Math.min(Math.PI - 0.1, spherical.phi - dy * 0.008));
  }
  if (e.touches.length === 2) {
    const dist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
    spherical.radius = Math.max(0.5, Math.min(50, spherical.radius - (dist - lastTouchDist) * 0.02));
    lastTouchDist = dist;
  }
}, { passive: false });

function updateCamera() {
  camera.position.x = target.x + spherical.radius * Math.sin(spherical.phi) * Math.sin(spherical.theta);
  camera.position.y = target.y + spherical.radius * Math.cos(spherical.phi);
  camera.position.z = target.z + spherical.radius * Math.sin(spherical.phi) * Math.cos(spherical.theta);
  camera.lookAt(target);
}

function animate() {
  requestAnimationFrame(animate);
  updateCamera();
  renderer.render(scene, camera);
}
animate();

// ─── OBJ Parser ──────────────────────────────────────────────────────────────
function parseOBJ(text) {
  const vertices = [], normals = [], uvs = [];
  const positions = [], normalData = [], uvData = [];
  const lines = text.split('\n');

  for (const line of lines) {
    const parts = line.trim().split(/\s+/);
    if (parts[0] === 'v')  vertices.push(parseFloat(parts[1]), parseFloat(parts[2]), parseFloat(parts[3]));
    if (parts[0] === 'vn') normals.push(parseFloat(parts[1]), parseFloat(parts[2]), parseFloat(parts[3]));
    if (parts[0] === 'vt') uvs.push(parseFloat(parts[1]), parseFloat(parts[2]));
    if (parts[0] === 'f') {
      const faceVerts = parts.slice(1).map(p => {
        const idx = p.split('/').map(x => parseInt(x) || 0);
        return idx;
      });
      // Triangulate
      for (let i = 1; i < faceVerts.length - 1; i++) {
        for (const fv of [faceVerts[0], faceVerts[i], faceVerts[i+1]]) {
          const vi = (fv[0] - 1) * 3;
          positions.push(vertices[vi], vertices[vi+1], vertices[vi+2]);
          if (fv[1] && uvs.length) { const ui = (fv[1]-1)*2; uvData.push(uvs[ui], uvs[ui+1]); }
          if (fv[2] && normals.length) { const ni = (fv[2]-1)*3; normalData.push(normals[ni], normals[ni+1], normals[ni+2]); }
        }
      }
    }
  }
  return { positions, normals: normalData, uvs: uvData, vertexCount: vertices.length / 3, faceCount: positions.length / 9 };
}

function loadObj(objText, elapsed) {
  loadingText.textContent = 'Đang render 3D mesh...';
  setTimeout(() => {
    try {
      const parsed = parseOBJ(objText);

      if (parsed.positions.length === 0) throw new Error('File OBJ không có geometry hợp lệ');

      if (currentMesh) { scene.remove(currentMesh); currentMesh = null; }

      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.Float32BufferAttribute(parsed.positions, 3));
      if (parsed.normals.length) geo.setAttribute('normal', new THREE.Float32BufferAttribute(parsed.normals, 3));
      else geo.computeVertexNormals();

      const mat = new THREE.MeshStandardMaterial({
        color: 0xb8b0f0,
        roughness: 0.6,
        metalness: 0.1,
        side: THREE.DoubleSide
      });

      currentMesh = new THREE.Mesh(geo, mat);

      // Center & normalize
      geo.computeBoundingBox();
      const box = geo.boundingBox;
      const center = new THREE.Vector3();
      box.getCenter(center);
      currentMesh.position.sub(center);
      const size = new THREE.Vector3();
      box.getSize(size);
      const maxDim = Math.max(size.x, size.y, size.z);
      if (maxDim > 0) { const scale = 2 / maxDim; currentMesh.scale.setScalar(scale); }

      scene.add(currentMesh);

      // Reset camera
      spherical = { theta: 0.5, phi: 1.2, radius: 4 };
      target.set(0, 0, 0);

      // Update UI
      loadingOv.style.display = 'none';
      vpToolbar.style.display = 'flex';
      statusDot.className = 'status-dot success';
      statusText.textContent = 'Hoàn thành — mô hình 3D đã sẵn sàng';
      btnDownload.style.display = 'flex';
      btnGenerate.disabled = false;

      infoVerts.textContent = parsed.vertexCount.toLocaleString();
      infoFaces.textContent = parsed.faceCount.toLocaleString();
      infoSize.textContent = (objText.length / 1024).toFixed(1) + ' KB';
      infoTime.textContent = elapsed + 's';

    } catch (err) {
      loadingOv.style.display = 'none';
      statusDot.className = 'status-dot error';
      statusText.textContent = '⚠ Không đọc được OBJ: ' + err.message;
      btnGenerate.disabled = false;
      vpIdle.style.display = 'flex';
    }
  }, 50);
}

// ─── Toolbar buttons ─────────────────────────────────────────────────────────
document.getElementById('btn-wireframe').addEventListener('click', function() {
  wireframeMode = !wireframeMode;
  this.classList.toggle('active', wireframeMode);
  if (currentMesh) {
    currentMesh.material.wireframe = wireframeMode;
  }
});

document.getElementById('btn-reset-cam').addEventListener('click', () => {
  spherical = { theta: 0.5, phi: 1.2, radius: 4 };
  target.set(0, 0, 0);
});
</script>
